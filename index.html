<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEBox - Extremely Easy Box</title>
    <style>
      body {
        background-color: #0b0b0c;
        color: #e1e1e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .container {
        max-width: 600px;
        width: 100%;
        text-align: center;
        padding: 40px;
        background: #161618;
        border: 1px solid #27272a;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      h1 {
        margin-top: 0;
        font-size: 2.5rem;
        letter-spacing: -1px;
        color: #ffffff;
      }
      hr {
        border: none;
        height: 1px;
        background: #27272a;
        margin: 20px 0;
      }
      p {
        line-height: 1.6;
        color: #a1a1aa;
        font-size: 1rem;
        margin-bottom: 20px;
      }
      .download-btn {
        display: inline-block;
        background-color: #ffffff;
        color: #0b0b0c;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        padding: 12px 32px;
        border-radius: 8px;
        border: 1px solid #ffffff;
        transition: background-color 0.2s ease, transform 0.1s ease, color 0.2s ease;
        cursor: pointer;
      }
      .download-btn:hover {
        background-color: #d4d4d8;
        border-color: #d4d4d8;
      }
      .download-btn:active {
        transform: scale(0.97);
      }
      footer {
        margin-top: 30px;
        font-size: 0.85rem;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>EEBox</h1>
        <hr>
        <p>An open-source simple sandbox game built on Unity 2022.3.62f3. 
          What does EEBox mean? Extremely Easy Box. 
          This game has no dumb things like built-in save or mod systems, 
          tools or complicated things. Only pure dragging, creation and activation.</p>
      </header>

      <a href="https://oramix.itch.io/eebox" class="download-btn" target="_blank" rel="noopener noreferrer">
        Download
      </a>

      <footer>
        <p>OramiX © <span id="year"></span></p>
      </footer>
    </div>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
